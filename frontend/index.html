<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyron Labs - Diagnóstico Digital</title>
    <link href="./styles/main.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <!-- Glow Orbs -->
    <div class="glow-orbe glow-orbe-1"></div>
    <div class="glow-orbe glow-orbe-2"></div>
    <div class="glow-orbe glow-orbe-3"></div>

    <!-- Header -->
    <header class="header-zyron">
        <div class="container flex-between">
            <a href="/" class="logo">
                <img src="./assets/logo.png" alt="Zyron Labs" style="height: 40px; width: auto;">
                <span class="logo-text">Zyron Labs</span>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
                    <div class="toggle-track">
                        <div class="toggle-thumb" id="themeThumb"><i class="ph ph-moon ph-bold"></i></div>
                    </div>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container py-12">
        <div class="max-w-3xl mx-auto text-center">
            <div class="inline-block px-4 py-2 bg-zyron-primary/20 rounded-full text-zyron-primary text-sm font-semibold mb-6">
                <i class="ph ph-robot ph-bold"></i> Diagnóstico Digital Grátis
            </div>
            
            <h1 class="text-4xl md:text-6xl font-extrabold mb-6">
                Descubra o <span class="text-gradient">Nível Digital</span> do Seu Negócio
            </h1>
            
            <p class="text-lg text-white-70 mb-8 max-w-2xl mx-auto">
                Responda 10 perguntas rápidas e receba um diagnóstico completo 
                com recomendações personalizadas para o seu negócio.
            </p>
            
            <div class="glass-card-glow p-8 max-w-md mx-auto">
                <h2 class="text-xl font-bold mb-4"><i class="ph ph-rocket ph-bold ph-primary"></i> Comece Agora</h2>
                
                <form id="leadForm" class="space-y-4">
                    <div class="input-with-icon">
                        <i class="ph ph-user ph-bold input-icon"></i>
                        <input type="text" id="nome" placeholder="Seu nome" required class="input-zyron">
                    </div>
                    <div class="input-with-icon">
                        <i class="ph ph-buildings ph-bold input-icon"></i>
                        <input type="text" id="empresa" placeholder="Nome da empresa (opcional)" class="input-zyron">
                    </div>
                    <div class="input-with-icon">
                        <i class="ph ph-whatsapp-logo ph-bold input-icon"></i>
                        <input type="tel" id="whatsapp" placeholder="WhatsApp (ex: +258846790902)" required class="input-zyron">
                    </div>
                    <div class="input-with-icon">
                        <i class="ph ph-envelope ph-bold input-icon"></i>
                        <input type="email" id="email" placeholder="Seu email" required class="input-zyron">
                    </div>
                    <div class="input-with-icon">
                        <i class="ph ph-tag ph-bold input-icon"></i>
                        <select id="segmento" required class="input-zyron">
                            <option value="">Segmento do negócio</option>
                            <option value="Restaurante">Restaurante</option>
                            <option value="Clínica">Clínica/Saúde</option>
                            <option value="Escola">Escola/Educação</option>
                            <option value="Loja">Loja/Comércio</option>
                            <option value="Serviços">Serviços</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    
                    <button type="submit" id="btnSubmit" class="btn-primary w-full">
                        <i class="ph ph-arrow-right ph-bold"></i> Começar Diagnóstico
                    </button>
                </form>
                <div id="loadingMessage" class="mt-4 text-zyron-primary text-sm hidden">
                    <i class="ph ph-spinner ph-bold ph-spin"></i> Criando seu diagnóstico...
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://zyron-quiz.onrender.com/api";
        
        // ===== THEME TOGGLE =====
        function toggleTheme() {
            const body = document.body;
            const thumb = document.getElementById('themeThumb');
            if (body.classList.contains('dark-theme')) {
                body.classList.remove('dark-theme');
                body.classList.add('white-theme');
                localStorage.setItem('theme', 'white');
                thumb.innerHTML = '<i class="ph ph-sun ph-bold"></i>';
            } else {
                body.classList.remove('white-theme');
                body.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
                thumb.innerHTML = '<i class="ph ph-moon ph-bold"></i>';
            }
        }

        function loadTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            const body = document.body;
            const thumb = document.getElementById('themeThumb');
            if (saved === 'white') {
                body.classList.add('white-theme');
                body.classList.remove('dark-theme');
                if (thumb) thumb.innerHTML = '<i class="ph ph-sun ph-bold"></i>';
            } else {
                body.classList.add('dark-theme');
                body.classList.remove('white-theme');
                if (thumb) thumb.innerHTML = '<i class="ph ph-moon ph-bold"></i>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadTheme);

        // ===== LEAD FORM =====
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const empresa = document.getElementById('empresa').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const email = document.getElementById('email').value;
            const segmento = document.getElementById('segmento').value;
            
            if (!nome || !whatsapp || !email || !segmento) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }
            
            const btn = document.getElementById('btnSubmit');
            const loading = document.getElementById('loadingMessage');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-spinner ph-bold ph-spin"></i> Processando...';
            loading.classList.remove('hidden');
            
            try {
                const response = await fetch(`${API_URL}/leads`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, empresa, whatsapp, email, segmento })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('leadId', data.leadId);
                    localStorage.setItem('leadNome', nome);
                    window.location.href = '/quiz.html';
                } else {
                    alert(data.error || 'Erro ao criar lead. Tente novamente.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert(`Erro ao conectar com o servidor:\n${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="ph ph-arrow-right ph-bold"></i> Começar Diagnóstico';
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
